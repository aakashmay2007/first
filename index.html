<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Confession</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 50px; }
        .heart { color: red; font-size: 50px; }
        footer { margin-top: 20px; font-size: 12px; color: gray; }
    </style>
</head>
<body>
    <h1>Happy Valentine's Day!</h1>
    <div class="heart">❤️</div>
    <p>Do you want to tell someone special how you feel?</p>
    <form>
        <textarea placeholder="Write your confession here..." rows="5" cols="40"></textarea><br>
        <button type="submit">Submit</button>
    </form>
    <footer>Created by param ❤️</footer>
</body>
</html>
